<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Modern Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Receipt Paper Gradient -->
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="receiptShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Container Base / Rounded Square -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGradient)" filter="url(#dropShadow)" />

  <!-- Outer Decorative Ring / Web Pulse -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="4" />

  <!-- Printer Top Paper Feed (Receipt Paper) -->
  <g filter="url(#receiptShadow)">
    <path d="M 176 100 
             L 336 100 
             L 336 210 
             L 316 200 
             L 296 210 
             L 276 200 
             L 256 210 
             L 236 200 
             L 216 210 
             L 196 200 
             L 176 210 
             Z" 
          fill="url(#paperGradient)" />

    <!-- Receipt Printed Text Lines -->
    <rect x="200" y="124" width="112" height="10" rx="5" fill="#9CA3AF" />
    <rect x="200" y="144" width="80" height="8" rx="4" fill="#D1D5DB" />
    <rect x="200" y="160" width="96" height="8" rx="4" fill="#D1D5DB" />
    <rect x="200" y="176" width="64" height="8" rx="4" fill="#3B82F6" />
  </g>

  <!-- Main Printer Body (Dark Sleek Case) -->
  <rect x="120" y="196" width="272" height="180" rx="28" fill="#1E293B" filter="url(#dropShadow)" />
  <rect x="136" y="212" width="240" height="148" rx="20" fill="#0F172A" />

  <!-- Printer Output Slot / Mouth -->
  <rect x="160" y="210" width="192" height="16" rx="8" fill="#334155" />
  <rect x="176" y="214" width="160" height="8" rx="4" fill="#020617" />

  <!-- Control Lights / Status LEDs -->
  <circle cx="160" cy="300" r="10" fill="#10B981" /> <!-- Power/Ready Green LED -->
  <circle cx="160" cy="300" r="5" fill="#34D399" />
  <circle cx="190" cy="300" r="8" fill="#F59E0B" opacity="0.8" /> <!-- Status Yellow LED -->

  <!-- Feed Action Button -->
  <rect x="310" y="288" width="42" height="24" rx="12" fill="#334155" />
  <rect x="314" y="292" width="34" height="16" rx="8" fill="#475569" />

  <!-- Wireless / Web Signal Waves (Top Right Branding) -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" stroke-width="6" opacity="0.9">
    <!-- Small Wave -->
    <path d="M 330 115 A 30 30 0 0 1 365 150" />
    <!-- Medium Wave -->
    <path d="M 345 100 A 50 50 0 0 1 400 155" stroke-width="7" />
    <!-- Large Wave -->
    <path d="M 360 85 A 70 70 0 0 1 435 160" stroke-width="8" />
  </g>
  <circle cx="320" cy="160" r="6" fill="#FFFFFF" />

  <!-- Base Stand / Paper Slot Accent -->
  <rect x="160" y="376" width="192" height="24" rx="8" fill="#1E293B" opacity="0.8" />
</svg>
